name: macOS

on:
  push:
    paths-ignore:
      - README.md
      - docs/**
  pull_request:
    paths-ignore:
      - README.md
      - docs/**

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: ./scripts/test.sh --filter PocketTests --skip PanelViewTests
      - name: Hosted panel layout tests
        run: ./scripts/test.sh --skip-build --filter PanelViewTests --no-parallel
      - name: Animation and desktop integration tests
        env:
          POCKET_DESKTOP_TESTS: "1"
        run: ./scripts/test.sh --filter PocketAnimationTests --no-parallel
      - name: Build app bundle
        run: ./scripts/build-app.sh
